# ── Namespace ─────────────────────────────────────────────────────────────────
# All sandbox pods run in their own namespace — isolated from system workloads.
# Apply: kubectl apply -f k8s/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: sandboxes
  labels:
    app: sandboxing-platform

---
# ── ServiceAccount ────────────────────────────────────────────────────────────
# The orchestration engine uses this service account to talk to the K8s API.
# When running inside the cluster it gets this token automatically.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: sandboxes

---
# ── ClusterRole ───────────────────────────────────────────────────────────────
# Defines exactly what the orchestrator is allowed to do.
# Principle of least privilege — only what is needed, nothing more.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-orchestrator
rules:
  # pods — create, list, watch, delete sandbox pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # pods/exec — run commands inside pods (exec, PTY, file writes)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

  # pods/log — read pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # secrets — create/delete per-sandbox secret objects for secret injection
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get"]

  # persistentvolumeclaims — create/delete PVCs for persistent sandboxes
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "delete"]

  # volumesnapshots — create snapshots of sandbox PVCs
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get", "list", "delete"]

  # events — read events for debugging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
# ── ClusterRoleBinding ────────────────────────────────────────────────────────

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-orchestrator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-orchestrator
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: sandboxes

---
# ── NetworkPolicy ─────────────────────────────────────────────────────────────
# Blocks all traffic between sandbox pods by default.
# Sandboxes cannot reach each other or the cluster internal network.
# Only the orchestrator can reach sandbox pods (for exec).
# Outbound internet is blocked by default — enabled per-sandbox via allowedDomains.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation
  namespace: sandboxes
spec:
  podSelector:
    matchLabels:
      app: sandbox
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # only allow traffic from the orchestrator service
    - from:
        - podSelector:
            matchLabels:
              app: orchestrator
  egress:
    # allow DNS resolution so packages can install
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # block everything else by default
    # individual sandboxes get additional egress rules
    # when allowedDomains is set on create()
