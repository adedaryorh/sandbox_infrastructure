# ── nginx-ingress ─────────────────────────────────────────────────────────────
# You do NOT build this. Install it with one helm command:
#
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#   helm repo update
#   helm install ingress-nginx ingress-nginx/ingress-nginx \
#     --namespace ingress-nginx --create-namespace \
#     --set controller.service.type=LoadBalancer
#
# On bare metal with MetalLB:
#   helm install ingress-nginx ingress-nginx/ingress-nginx \
#     --namespace ingress-nginx --create-namespace \
#     --set controller.service.type=LoadBalancer \
#     --set controller.service.loadBalancerIP=YOUR_METALLB_IP
#
# After install the cloud provider automatically provisions a LoadBalancer.
# You point your DNS *.sandbox.yourplatform.com → that LB IP.

---
# ── Ingress rule ──────────────────────────────────────────────────────────────
# Routes external HTTPS traffic to your orchestrator service.
# TLS is terminated here — nginx handles certificates via cert-manager.
#
# Install cert-manager for automatic Let's Encrypt certificates:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchestrator-ingress
  namespace: sandboxes
  annotations:
    # use nginx ingress controller
    kubernetes.io/ingress.class: nginx

    # automatic TLS via cert-manager + Let's Encrypt
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # increase timeouts for SSE and WebSocket connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # enable WebSocket proxying (needed for PTY)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

spec:
  tls:
    - hosts:
        - api.sandbox.yourplatform.com
      secretName: orchestrator-tls

  rules:
    - host: api.sandbox.yourplatform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 80

---
# ── cert-manager ClusterIssuer ────────────────────────────────────────────────
# Automatically provisions Let's Encrypt TLS certificates.
# Replace email with your real email address.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@yourcompany.com      # ← replace
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
