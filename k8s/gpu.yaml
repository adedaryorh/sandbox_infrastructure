# ── GPU Tier ──────────────────────────────────────────────────────────────────
# GPU sandboxes always use the secure isolation tier (gVisor).
# GPU nodes run on a dedicated node pool with NVIDIA drivers pre-installed.
#
# On Hetzner: use AX-series dedicated servers with NVIDIA cards.
# On AWS:     add a GPU node group to EKS (g4dn.xlarge / p3.2xlarge).
# On GCP:     add a GPU node pool to GKE with NVIDIA T4 or A100.
#
# Step 1 — Install NVIDIA drivers on GPU nodes:
#   Ubuntu 22.04:
#   apt-get install -y nvidia-driver-535 nvidia-container-toolkit
#   systemctl restart containerd
#
# Step 2 — Install the NVIDIA device plugin:
#   kubectl apply -f https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.14.5/nvidia-device-plugin.yml
#
# Step 3 — Apply this file:
#   kubectl apply -f k8s/gpu.yaml

---
# ── RuntimeClass for GPU sandboxes ────────────────────────────────────────────
# GPU sandboxes use gVisor (secure tier) — same as regular secure sandboxes.
# No extra RuntimeClass needed — they reuse the gvisor RuntimeClass from runtimeclass.yaml.

---
# ── GPU node label ────────────────────────────────────────────────────────────
# Label your GPU nodes so the orchestrator can schedule GPU pods on them.
#
#   kubectl label nodes <gpu-node-name> node-type=gpu
#   kubectl label nodes <gpu-node-name> nvidia.com/gpu.present=true

---
# ── ResourceQuota for GPU namespace ───────────────────────────────────────────
# Prevent runaway GPU usage — limit how many GPUs can be allocated at once.

apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-quota
  namespace: sandboxes
spec:
  hard:
    requests.nvidia.com/gpu: "8"    # max 8 GPUs across all sandbox pods
    limits.nvidia.com/gpu: "8"

---
