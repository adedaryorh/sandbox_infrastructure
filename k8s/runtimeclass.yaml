# ── gVisor RuntimeClass ───────────────────────────────────────────────────────
# Apply this ONCE to any cluster after installing gVisor on worker nodes.
# This tells Kubernetes that pods with runtimeClassName: gvisor
# should use the runsc handler (gVisor) instead of runc (Docker).
#
# Install gVisor on each worker node first:
#   curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor.gpg
#   echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
#   sudo apt-get update && sudo apt-get install -y runsc
#
# Then add to /etc/containerd/config.toml on each node:
#   [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
#     runtime_type = "io.containerd.runsc.v1"
#
# Then: kubectl apply -f k8s/runtimeclass.yaml

apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
