version: "3.9"

# ── Local development stack ───────────────────────────────────────────────────
# Run the full platform locally without a real Kubernetes cluster.
# The server uses your local kubeconfig (k3s or kind) to manage pods.
#
# Usage:
#   docker-compose up -d
#   export SANDBOX_API_URL=http://localhost:8080
#   export SANDBOX_API_KEY=dev-key
#   sandbox create --template python

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sandboxing
      POSTGRES_USER: sandboxing
      POSTGRES_PASSWORD: sandboxing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandboxing"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Orchestration engine (your Go service) ──────────────────────────────────
  # Note: The server is now run locally on the host, not in Docker.
  # server:
  #   build: .
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     PORT: "8080"
  #     DATABASE_URL: "postgres://sandboxing:sandboxing@postgres:5432/sandboxing?sslmode=disable"
  #     SANDBOX_NAMESPACE: "sandboxes"
  #     KUBECONFIG: "/kubeconfig/config"
  #     CADDY_ADMIN_URL: "http://caddy:2019"
  #     PLATFORM_DOMAIN: "localhost"
  #     WARM_PYTHON: "2"
  #     WARM_NODE: "2"
  #     WARM_UBUNTU: "1"
  #     TASK_WORKERS: "3"
  #   volumes:
  #     - ${HOME}/.kube:/kubeconfig:ro
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # ── Caddy (reverse proxy for preview URLs + MCP) ────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"   # Caddy Admin API — used by router.go
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ── Jaeger (optional — for OpenTelemetry traces in local dev) ───────────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI — open http://localhost:16686
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles:
      - tracing   # only start with: docker-compose --profile tracing up

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
